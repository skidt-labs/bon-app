<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #1f548a; }
    a:hover { color: #163d66; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #f6f8fa; font-family: 'Manrope', system-ui, sans-serif; color: #111a3b; overflow: hidden;">

  <div style="flex-shrink: 0; padding: 22px 20px 0;">
    <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #8a93a6;">Bon-App</div>
    <div style="font-size: 27px; font-weight: 800; letter-spacing: -0.02em; margin-top: 3px;">Bon erfassen</div>
  </div>

  <!-- Die zwei Eingänge, gleichrangig und gross -->
  <div style="flex-shrink: 0; padding: 22px 20px 0; display: flex; flex-direction: column; gap: 12px;">

    <button style="display: flex; align-items: center; gap: 15px; height: 96px; padding: 0 20px; border: none; border-radius: 16px; background: #1f548a; color: #ffffff; font-family: 'Manrope', sans-serif; text-align: left;">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3.5"/></svg>
      <span style="display: flex; flex-direction: column; gap: 3px;">
        <span style="font-size: 19px; font-weight: 700;">Kamera</span>
        <span style="font-size: 13px; opacity: 0.82;">an der Kasse, direkt nach dem Zahlen</span>
      </span>
    </button>

    <button style="display: flex; align-items: center; gap: 15px; height: 96px; padding: 0 20px; border: 1px solid #dde3ea; border-radius: 16px; background: #ffffff; color: #111a3b; font-family: 'Manrope', sans-serif; text-align: left;">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1f548a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><rect x="3" y="3" width="18" height="18" rx="2.5"/><circle cx="8.5" cy="8.5" r="1.8"/><path d="m21 15-5-5L5 21"/></svg>
      <span style="display: flex; flex-direction: column; gap: 3px;">
        <span style="font-size: 19px; font-weight: 700;">Aus der Galerie</span>
        <span style="font-size: 13px; color: #5a6478;">mehrere auf einmal, auch lange Bons</span>
      </span>
    </button>
  </div>

  <!-- Wartende Uploads: die einzige Stelle, an der Verlust sichtbar wird -->
  <div style="flex-shrink: 0; margin: 16px 20px 0; border-radius: 14px; background: #fdf4e3; padding: 14px 16px; display: flex; align-items: center; gap: 12px;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a86a11" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M12 7v5l3 2"/><circle cx="12" cy="12" r="9"/></svg>
    <span style="flex: 1; font-size: 14px; color: #6b5227; line-height: 1.4;">
      <strong style="color: #8a5610;">2 Bons warten auf Upload.</strong>
      Sie gehen raus, sobald wieder Netz da ist.
    </span>
  </div>

  <div style="flex: 1;"></div>

  <!-- Was ansteht -->
  <div style="flex-shrink: 0; padding: 0 20px 20px;">
    <a href="#" style="display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-radius: 14px; background: #ffffff; text-decoration: none; color: inherit;">
      <span style="display: flex; align-items: center; justify-content: center; width: 42px; height: 42px; border-radius: 12px; background: #e0f6f8; flex-shrink: 0;">
        <span style="font-size: 17px; font-weight: 800; color: #07889a; font-variant-numeric: tabular-nums;">3</span>
      </span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 16px; font-weight: 700;">Posteingang</span>
        <span style="font-size: 13px; color: #5a6478;">3 Bons warten auf deine Prüfung</span>
      </span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8a93a6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
    </a>

    <div style="display: flex; gap: 18px; justify-content: center; margin-top: 18px;">
      <a href="#" style="font-size: 13px; color: #5a6478; text-decoration: none;">Haushalt</a>
      <span style="color: #c9d1da;">·</span>
      <a href="#" style="font-size: 13px; color: #5a6478; text-decoration: none;">Matrix-Anbindung</a>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
